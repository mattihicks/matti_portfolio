<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 768" width="1152" height="768">
  <defs>
    <filter id="watercolor-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="soft-shadow-gold">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#D97706" flood-opacity="0.12"/>
    </filter>
    <radialGradient id="bg-wash-gold" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="progress-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="card-grad-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1152" height="768" fill="#FDF8F3"/>

  <!-- Watercolor wash -->
  <ellipse cx="576" cy="380" rx="360" ry="240" fill="url(#bg-wash-gold)" filter="url(#watercolor-gold)"/>

  <!-- Main dashboard card — THE HERO: "Available to spend" card with progress -->
  <g filter="url(#soft-shadow-gold)" transform="translate(576, 330)">

    <!-- Large card -->
    <rect x="-170" y="-110" width="340" height="200" rx="20" fill="url(#card-grad-gold)" opacity="0.65"/>

    <!-- "Available to spend" label -->
    <rect x="-140" y="-82" width="110" height="7" rx="3.5" fill="#92400E" opacity="0.25"/>

    <!-- Big amount -->
    <rect x="-140" y="-62" width="150" height="16" rx="5" fill="#D97706" opacity="0.4"/>

    <!-- Progress bar track -->
    <rect x="-140" y="-30" width="280" height="14" rx="7" fill="#FEF3C7" opacity="0.7"/>
    <!-- Progress bar fill (~65%) -->
    <rect x="-140" y="-30" width="182" height="14" rx="7" fill="url(#progress-fill)" opacity="0.6"/>

    <!-- "Building stability" label -->
    <rect x="-140" y="-6" width="85" height="5" rx="2.5" fill="#92400E" opacity="0.18"/>

    <!-- Divider -->
    <line x1="-140" y1="12" x2="140" y2="12" stroke="#D97706" stroke-opacity="0.12" stroke-width="1"/>

    <!-- Spending categories (small rows) -->
    <g transform="translate(0, 30)">
      <circle cx="-126" cy="0" r="5" fill="#F59E0B" opacity="0.35"/>
      <rect x="-114" y="-3" width="60" height="5" rx="2.5" fill="#92400E" opacity="0.15"/>
      <rect x="80" y="-3" width="40" height="5" rx="2.5" fill="#D97706" opacity="0.2"/>
    </g>
    <g transform="translate(0, 50)">
      <circle cx="-126" cy="0" r="5" fill="#FBBF24" opacity="0.3"/>
      <rect x="-114" y="-3" width="50" height="5" rx="2.5" fill="#92400E" opacity="0.12"/>
      <rect x="80" y="-3" width="35" height="5" rx="2.5" fill="#D97706" opacity="0.15"/>
    </g>
    <g transform="translate(0, 70)">
      <circle cx="-126" cy="0" r="5" fill="#FDE68A" opacity="0.3"/>
      <rect x="-114" y="-3" width="55" height="5" rx="2.5" fill="#92400E" opacity="0.1"/>
      <rect x="80" y="-3" width="30" height="5" rx="2.5" fill="#D97706" opacity="0.12"/>
    </g>
  </g>

  <!-- AI sparkle accents -->
  <g opacity="0.35">
    <!-- Sparkle 1 -->
    <g transform="translate(450, 250)">
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5" y1="-5" x2="-5" y2="5" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- Sparkle 2 -->
    <g transform="translate(720, 280) scale(0.7)">
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5" y1="-5" x2="-5" y2="5" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- Sparkle 3 -->
    <g transform="translate(680, 490) scale(0.5)">
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>