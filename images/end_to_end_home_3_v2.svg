<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 768" width="1152" height="768">
  <defs>
    <filter id="watercolor-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="soft-shadow-purple">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#8B5CF6" flood-opacity="0.15"/>
    </filter>
    <radialGradient id="bg-wash-purple" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#C4B5F9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C4B5F9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pill-grad-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="pill-grad-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1152" height="768" fill="#FDF8F3"/>

  <!-- Watercolor wash -->
  <ellipse cx="576" cy="384" rx="350" ry="250" fill="url(#bg-wash-purple)" filter="url(#watercolor-purple)"/>

  <!-- Phone screen outline (subtle context) -->
  <g filter="url(#soft-shadow-purple)" transform="translate(576, 360)">
    <rect x="-115" y="-200" width="230" height="380" rx="22" fill="#F3EFFC" opacity="0.5"/>

    <!-- Header area -->
    <rect x="-95" y="-175" width="190" height="28" rx="6" fill="#7C3AED" opacity="0.35"/>
    <rect x="-80" y="-167" width="80" height="5" rx="2.5" fill="white" opacity="0.5"/>
    <!-- Small close/back icon -->
    <circle cx="78" cy="-161" r="7" fill="white" opacity="0.3"/>

    <!-- "When will you go?" title abstraction -->
    <rect x="-95" y="-135" width="100" height="7" rx="3.5" fill="#6D28D9" opacity="0.3"/>

    <!-- Date selection pills — THE HERO ELEMENT -->
    <!-- Pill 1 (selected) -->
    <g transform="translate(0, -105)">
      <rect x="-95" y="0" width="190" height="38" rx="12" fill="url(#pill-grad-1)"/>
      <!-- Radio circle (filled = selected) -->
      <circle cx="-74" cy="19" r="7" fill="white" opacity="0.9"/>
      <circle cx="-74" cy="19" r="4" fill="#7C3AED" opacity="0.8"/>
      <!-- Date text lines -->
      <rect x="-58" y="11" width="80" height="5" rx="2.5" fill="white" opacity="0.7"/>
      <rect x="-58" y="21" width="55" height="4" rx="2" fill="white" opacity="0.45"/>
      <!-- Price -->
      <rect x="52" y="14" width="30" height="6" rx="3" fill="white" opacity="0.5"/>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(0, -58)">
      <rect x="-95" y="0" width="190" height="38" rx="12" fill="url(#pill-grad-2)"/>
      <circle cx="-74" cy="19" r="7" fill="white" opacity="0.5"/>
      <rect x="-58" y="11" width="75" height="5" rx="2.5" fill="white" opacity="0.45"/>
      <rect x="-58" y="21" width="50" height="4" rx="2" fill="white" opacity="0.3"/>
      <rect x="52" y="14" width="30" height="6" rx="3" fill="white" opacity="0.35"/>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(0, -11)">
      <rect x="-95" y="0" width="190" height="38" rx="12" fill="#A78BFA" opacity="0.35"/>
      <circle cx="-74" cy="19" r="7" fill="#8B5CF6" opacity="0.3"/>
      <rect x="-58" y="11" width="70" height="5" rx="2.5" fill="#6D28D9" opacity="0.2"/>
      <rect x="-58" y="21" width="48" height="4" rx="2" fill="#6D28D9" opacity="0.15"/>
      <rect x="52" y="14" width="30" height="6" rx="3" fill="#6D28D9" opacity="0.2"/>
    </g>

    <!-- Pill 4 (fading out) -->
    <g transform="translate(0, 36)">
      <rect x="-95" y="0" width="190" height="38" rx="12" fill="#A78BFA" opacity="0.2"/>
      <circle cx="-74" cy="19" r="7" fill="#8B5CF6" opacity="0.18"/>
      <rect x="-58" y="11" width="65" height="5" rx="2.5" fill="#6D28D9" opacity="0.12"/>
      <rect x="-58" y="21" width="42" height="4" rx="2" fill="#6D28D9" opacity="0.1"/>
    </g>

    <!-- Pill 5 (very faint, cropped) -->
    <g transform="translate(0, 83)">
      <rect x="-95" y="0" width="190" height="38" rx="12" fill="#A78BFA" opacity="0.1"/>
      <circle cx="-74" cy="19" r="7" fill="#8B5CF6" opacity="0.08"/>
    </g>

    <!-- Month label -->
    <rect x="-95" y="130" width="50" height="6" rx="3" fill="#7C3AED" opacity="0.18"/>
  </g>
</svg>