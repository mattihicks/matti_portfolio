<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 768" width="1152" height="768">
  <defs>
    <filter id="watercolor-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="soft-shadow-pink">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#EC4899" flood-opacity="0.12"/>
    </filter>
    <radialGradient id="bg-wash-pink-l" cx="30%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F9A8D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-wash-pink-r" cx="70%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1152" height="768" fill="#FDF8F3"/>

  <!-- Watercolor washes for both sides -->
  <ellipse cx="340" cy="384" rx="250" ry="220" fill="url(#bg-wash-pink-l)" filter="url(#watercolor-pink)"/>
  <ellipse cx="812" cy="384" rx="250" ry="220" fill="url(#bg-wash-pink-r)" filter="url(#watercolor-pink)"/>

  <!-- LEFT SIDE: Fragmented, messy page wireframes (before) -->
  <g filter="url(#soft-shadow-pink)" transform="translate(340, 370)">
    <!-- Scattered page fragments at angles -->
    <g transform="rotate(-12)">
      <rect x="-110" y="-120" width="130" height="85" rx="8" fill="#FBCFE8" opacity="0.5"/>
      <!-- Messy nav bar -->
      <rect x="-98" y="-110" width="106" height="10" rx="3" fill="#EC4899" opacity="0.25"/>
      <!-- Scattered content blocks -->
      <rect x="-98" y="-92" width="50" height="5" rx="2" fill="#EC4899" opacity="0.15"/>
      <rect x="-30" y="-85" width="35" height="20" rx="4" fill="#F9A8D4" opacity="0.3"/>
      <rect x="-98" y="-60" width="70" height="4" rx="2" fill="#EC4899" opacity="0.12"/>
    </g>

    <g transform="rotate(8) translate(20, -30)">
      <rect x="-60" y="-60" width="110" height="75" rx="8" fill="#F9A8D4" opacity="0.45"/>
      <rect x="-48" y="-50" width="86" height="8" rx="3" fill="#EC4899" opacity="0.2"/>
      <rect x="-48" y="-35" width="40" height="4" rx="2" fill="#EC4899" opacity="0.12"/>
      <rect x="-48" y="-25" width="60" height="4" rx="2" fill="#EC4899" opacity="0.1"/>
    </g>

    <g transform="rotate(-5) translate(-30, 50)">
      <rect x="-55" y="-30" width="100" height="65" rx="8" fill="#FBCFE8" opacity="0.35"/>
      <rect x="-43" y="-20" width="76" height="7" rx="3" fill="#EC4899" opacity="0.18"/>
      <rect x="-43" y="-6" width="55" height="4" rx="2" fill="#EC4899" opacity="0.1"/>
    </g>
  </g>

  <!-- Arrow in the middle -->
  <g transform="translate(576, 384)">
    <line x1="-40" y1="0" x2="30" y2="0" stroke="#EC4899" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round"/>
    <polygon points="30,-8 46,0 30,8" fill="#EC4899" opacity="0.4"/>
  </g>

  <!-- RIGHT SIDE: Clean, organized page (after) -->
  <g filter="url(#soft-shadow-pink)" transform="translate(812, 360)">
    <!-- Clean phone screen -->
    <rect x="-105" y="-165" width="210" height="340" rx="20" fill="#FDF2F8" opacity="0.6"/>

    <!-- Clean header -->
    <rect x="-85" y="-140" width="170" height="26" rx="6" fill="#EC4899" opacity="0.35"/>
    <rect x="-72" y="-132" width="60" height="5" rx="2.5" fill="white" opacity="0.6"/>

    <!-- Hero image placeholder -->
    <rect x="-85" y="-105" width="170" height="70" rx="10" fill="#F9A8D4" opacity="0.4"/>
    <!-- Small mountain/landscape icon inside -->
    <polygon points="0,-80 -20,-60 20,-60" fill="#EC4899" opacity="0.15"/>
    <polygon points="15,-75 0,-60 30,-60" fill="#EC4899" opacity="0.2"/>

    <!-- Clean content sections -->
    <!-- Courses row -->
    <g transform="translate(0, -15)">
      <rect x="-85" y="0" width="50" height="45" rx="8" fill="#FBCFE8" opacity="0.45"/>
      <rect x="-27" y="0" width="50" height="45" rx="8" fill="#FBCFE8" opacity="0.35"/>
      <rect x="31" y="0" width="50" height="45" rx="8" fill="#FBCFE8" opacity="0.25"/>
      <!-- Small labels -->
      <rect x="-77" y="32" width="34" height="4" rx="2" fill="#EC4899" opacity="0.2"/>
      <rect x="-19" y="32" width="34" height="4" rx="2" fill="#EC4899" opacity="0.15"/>
      <rect x="39" y="32" width="34" height="4" rx="2" fill="#EC4899" opacity="0.12"/>
    </g>

    <!-- Living options section -->
    <rect x="-85" y="42" width="80" height="6" rx="3" fill="#BE185D" opacity="0.2"/>
    <rect x="-85" y="55" width="170" height="40" rx="8" fill="#FBCFE8" opacity="0.3"/>
    <rect x="-72" y="65" width="60" height="4" rx="2" fill="#EC4899" opacity="0.15"/>
    <rect x="-72" y="75" width="45" height="4" rx="2" fill="#EC4899" opacity="0.1"/>

    <!-- Activities section -->
    <rect x="-85" y="105" width="65" height="6" rx="3" fill="#BE185D" opacity="0.15"/>
    <rect x="-85" y="118" width="80" height="35" rx="8" fill="#FBCFE8" opacity="0.2"/>
    <rect x="3" y="118" width="80" height="35" rx="8" fill="#FBCFE8" opacity="0.15"/>
  </g>
</svg>