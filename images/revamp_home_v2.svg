<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 768" width="1152" height="768">
  <defs>
    <filter id="watercolor-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="soft-shadow-blue">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3B82F6" flood-opacity="0.15"/>
    </filter>
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="tab-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6BA1F7"/>
      <stop offset="100%" stop-color="#3B6FF0"/>
    </linearGradient>
    <linearGradient id="screen-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F0FE"/>
      <stop offset="100%" stop-color="#D4E4FC"/>
    </linearGradient>
    <radialGradient id="bg-wash-blue" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#B8D4F8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B8D4F8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1152" height="768" fill="#FDF8F3"/>

  <!-- Subtle watercolor wash -->
  <ellipse cx="576" cy="420" rx="380" ry="260" fill="url(#bg-wash-blue)" filter="url(#watercolor-blue)"/>

  <!-- Phone screen shape (abstracted) -->
  <g filter="url(#soft-shadow-blue)" transform="translate(576, 340)">
    <!-- Screen body -->
    <rect x="-120" y="-180" width="240" height="330" rx="24" fill="url(#screen-gradient)" opacity="0.7"/>

    <!-- Top nav bar abstraction (the signature element) -->
    <rect x="-100" y="-155" width="200" height="36" rx="6" fill="#5B8DEF" opacity="0.5"/>
    <!-- Nav tabs: Dashboard, Insights, Cards, Help -->
    <rect x="-90" y="-148" width="38" height="5" rx="2.5" fill="white" opacity="0.7"/>
    <rect x="-42" y="-148" width="32" height="5" rx="2.5" fill="white" opacity="0.4"/>
    <rect x="0" y="-148" width="26" height="5" rx="2.5" fill="white" opacity="0.4"/>
    <rect x="36" y="-148" width="22" height="5" rx="2.5" fill="white" opacity="0.4"/>
    <!-- Active indicator line -->
    <rect x="-90" y="-140" width="38" height="2.5" rx="1.25" fill="white" opacity="0.9"/>

    <!-- Balance card abstraction -->
    <rect x="-100" y="-105" width="200" height="60" rx="12" fill="white" opacity="0.6"/>
    <rect x="-82" y="-90" width="60" height="6" rx="3" fill="#5B8DEF" opacity="0.35"/>
    <rect x="-82" y="-76" width="90" height="10" rx="4" fill="#3B6FF0" opacity="0.4"/>

    <!-- Account list lines -->
    <rect x="-100" y="-30" width="200" height="34" rx="10" fill="white" opacity="0.45"/>
    <circle cx="-78" cy="-13" r="8" fill="#5B8DEF" opacity="0.3"/>
    <rect x="-64" y="-17" width="70" height="5" rx="2.5" fill="#3B6FF0" opacity="0.25"/>
    <rect x="-64" y="-8" width="45" height="4" rx="2" fill="#94B8F5" opacity="0.25"/>

    <rect x="-100" y="12" width="200" height="34" rx="10" fill="white" opacity="0.35"/>
    <circle cx="-78" cy="29" r="8" fill="#5B8DEF" opacity="0.25"/>
    <rect x="-64" y="25" width="65" height="5" rx="2.5" fill="#3B6FF0" opacity="0.2"/>
    <rect x="-64" y="34" width="50" height="4" rx="2" fill="#94B8F5" opacity="0.2"/>

    <!-- BOTTOM TAB BAR — the hero element -->
    <g transform="translate(0, 128)">
      <rect x="-120" y="0" width="240" height="52" rx="0" fill="#3B6FF0" opacity="0.75"/>
      <!-- Rounded top corners only via clip -->
      <rect x="-120" y="0" width="240" height="22" rx="0" fill="#3B6FF0" opacity="0.75"/>

      <!-- Tab icons (3 circles + labels) -->
      <!-- Home (active) -->
      <circle cx="-65" cy="16" r="10" fill="white" opacity="0.9"/>
      <rect x="-78" y="30" width="26" height="4" rx="2" fill="white" opacity="0.7"/>

      <!-- Move money -->
      <circle cx="0" cy="16" r="10" fill="white" opacity="0.4"/>
      <rect x="-16" y="30" width="32" height="4" rx="2" fill="white" opacity="0.35"/>

      <!-- Accounts -->
      <circle cx="65" cy="16" r="10" fill="white" opacity="0.4"/>
      <rect x="52" y="30" width="26" height="4" rx="2" fill="white" opacity="0.35"/>
    </g>
  </g>
</svg>